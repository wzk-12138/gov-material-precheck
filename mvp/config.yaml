# ===== 服务：只监听本机回环，数据与推理不离开本地 =====
service:  # 服务监听配置节
  host: "127.0.0.1"  # 仅本机可访问，禁止绑定 0.0.0.0 对外暴露
  port: 8000  # 手动启动端口；验证脚本自动改用 9000 以免端口冲突
# ===== 认证：角色与令牌绑定，禁止只凭明文角色头调用 =====
auth:  # 对外接口认证配置节
  required: true  # 强制校验；置 false 即退回明文角色模式，仅允许本地调试
  header_name: "X-Agent-Token"  # 凭据请求头名称，/health 免凭据
  token_env: "AGENT_ROLE_TOKENS"  # 凭据表所在环境变量名，值为 {"window":"令牌",...} 的 JSON，不落盘
  tenant_header: "X-Tenant"  # 租户请求头名称；不传时用 default_tenant，租户最终以令牌归属为准
  default_tenant: "default"  # 未显式指定租户时使用的默认租户键，便于旧凭据表平滑迁移
# ===== agent-harness：智能体运行壳的业务配置 =====
agent:  # 智能体运行壳配置节
  name: "办事材料预检智能体"  # 系统名（本轮已确认）
  system_prompt: "你只做办事材料清单预检与补正解释提示；必须引用给定证据编号；不得输出批准结论、不得解释法律效力、不得承诺办理结果；结论只作为待人工确认的建议；回答控制在 120 字内。"  # 系统提示集中配置，代码不写死；末句限制长度以压住 CPU 推理耗时
  no_evidence_hint: "未检索到可核对的规则依据，请转人工核对，本系统不给出结论。"  # 无命中规则时的兜底提示
# ===== 本机 Ollama：模型地址与名称集中配置，代码内禁止写死 =====
ollama:  # 本机模型配置节
  base_url: "http://127.0.0.1:11434"  # 本机 Ollama 服务地址，可改
  model: "qwen3.5:0.8b"  # 本机已拉取的模型名（原 qwen2.5:7b 未下载），换模型时须同步改文档
  timeout_seconds: 30  # 单次生成超时，给 CPU 冷启动与生成留余量
  probe_timeout_seconds: 5  # 模型列表探测超时，服务离线时快速返回不拖慢验证
  max_tokens: 160  # 生成上限，防止思考型模型无休止输出导致超时
  think: false  # 关闭思考链，确保结果落到 message.content 而不是 message.thinking
  required: false  # 未启动 Ollama 时降级为「仅检索提示」，人工流程照常（对齐 f35）
  temperature: 0.1  # 低温度，减少自由发挥导致的越权结论
# ===== 知识库：合成训练资料为唯一规则源，本地文件 + 标准库检索 =====
knowledge:  # 本地知识库配置节
  sources:  # 规则源清单，路径相对项目根目录
    - "../materials/discovery-report.json"  # 合成访谈事实，已归入上级 materials 文件夹，禁止替换为真实业务数据
  kb_path: "kb/rules.json"  # 由 scripts/build_kb.py 生成的本地规则库
  top_k: 3  # 每次检索返回的最多证据条数
  min_score: 0.02  # 低于该相关度视为无依据，必须转人工
# ===== 角色与权限：按六角色访谈事实配置（业务岗，能发起预检与确认） =====
roles:  # 角色与权限矩阵配置节
  window:  # 窗口工作人员 林亦舟
    label: "窗口工作人员"  # 显示名
    allow_precheck: true  # 可发起清单预检
    can_view_material: true  # 可查看授权范围内材料与证据原文
    allow_confirm: false  # 不能确认自己发起的建议
  reviewer:  # 业务审核员 唐映秋
    label: "业务审核员"  # 显示名
    allow_precheck: true  # 可发起清单预检
    can_view_material: true  # 可查看材料原文
    allow_confirm: true  # 可接手确认与核对
  supervisor:  # 数据与流程监督员 傅景
    label: "数据与流程监督员"  # 显示名
    allow_precheck: true  # 可发起清单预检
    can_view_material: true  # 按授权范围可查看材料
    allow_confirm: true  # 专业签核与风险否决
  hotline:  # 热线服务负责人 叶书
    label: "热线服务负责人"  # 显示名
    allow_precheck: true  # 可发起咨询类预检
    can_view_material: false  # 只看答复，不接触材料原文（f41）
    allow_confirm: false  # 不参与签核
  platform:  # 政务平台工程师 秦芮
    label: "政务平台工程师"  # 显示名
    allow_precheck: false  # 负责系统数据，不发起业务预检
    can_view_material: false  # 不查看业务材料
    allow_confirm: false  # 不参与签核
  director:  # 服务中心主任 顾明岚
    label: "服务中心主任"  # 显示名
    allow_precheck: false  # 负责目标与复盘，不发起日常预检
    can_view_material: false  # 不查看个体材料原文
    allow_confirm: false  # 不替代专业签核
# ===== 权限（白板④）：管理员（SaaS）与用户分层两支，请求体不参与鉴权 =====
permissions:  # 权限主体配置节，对应白板第④项
  admin_roles:  # 管理员角色白名单，与业务岗职责分离
    - "platform_admin"  # 平台管理员：管租户、发版本、导出全局审计
    - "tenant_admin"  # 租户管理员：管本中心账号、分层与凭据轮换
  tiers:  # 用户分层清单，由低到高
    - "L1"  # 一线执行：提交待确认单，不签核
    - "L2"  # 业务复核：可签核建议与 Wiki 条目
    - "L3"  # 监督决策：可写知识关联、看全量审计
  role_tier:  # 角色到分层的绑定，改层级属管理员动作并留审计
    window: "L1"  # 窗口为一线执行层
    hotline: "L1"  # 热线为一线执行层
    reviewer: "L2"  # 审核员为业务复核层
    supervisor: "L3"  # 监督员为监督决策层
    director: "L3"  # 主任为监督决策层
    platform: "L3"  # 平台工程师按监督层只读运行信息
  admin_can_precheck: false  # 管理员不得发起预检，避免既当裁判又当运动员
  admin_token_env: "AGENT_ADMIN_TOKENS"  # 管理员凭据表所在环境变量名，与业务岗凭据分开放置
  sensitive_actions:  # 需要第二位管理员复核的敏感管理动作
    - "disable_tenant"  # 关闭租户
    - "batch_change_tier"  # 批量改分层
    - "publish_rule_version"  # 发布规则版本
  admin_audit_path: "data/admin_audit.jsonl"  # 管理员动作单独留痕，与业务审计分开
  role_descriptions:  # 管理员职责说明，供 /admin/roles 只读展示
    platform_admin: "租户开通停用、配额、全局审计导出、模型与规则版本发布"  # 平台级管理员职责
    tenant_admin: "本中心账号开通停用、授予与调整用户分层、凭据轮换"  # 租户级管理员职责
# ===== RAG（白板③）：检索 → 增强 → 生成三段编排，不引入向量库 =====
rag:  # RAG 编排配置节，对应白板第③项的检索增强生成
  top_k: 3  # 进入上下文的最多证据条数，与 knowledge.top_k 取更小者
  min_score: 0.02  # 低于该相关度视为无依据，直接走兜底不调模型
  evidence_depth: 2  # 增强段沿知识关联扩展的跳数
  max_hops: 24  # 证据链最多逐跳关联数，防止把全图当证据
  max_context_items: 3  # 上下文证据条数硬上限
  max_graph_refs: 8  # 注入提示词的关联编号硬上限
  wiki_summary_in_context: true  # 是否把 1 条已发布条目摘要放进上下文
  no_evidence_hint: "未检索到可核对的规则依据，请转人工核对，本系统不给出结论。"  # 无命中时的兜底，不调模型
  degrade_hint: "依据上述证据编号逐项核对清单，差异处仅作提示，最终以窗口与审核员人工确认为准。"  # 模型未就绪时的兜底提示
# ===== LLM Wiki（白板③）：知识图谱的可读面，模型起草、人工确认后发布 =====
wiki:  # LLM Wiki 配置节，对应白板第③项的知识图谱可读层
  path: "kb/wiki.json"  # Wiki 条目快照路径，由 scripts/build_wiki.py 生成
  draft_visible_roles:  # 哪些角色可见 draft 条目（仅管理员），业务岗只见 published
    - "platform_admin"  # 平台管理员可见草稿
    - "tenant_admin"  # 租户管理员可见草稿
  publish_min_tier: "L2"  # 发布签核的最低用户层级，低于此拒绝
  max_summary_chars: 120  # 条目摘要长度上限，与系统提示词输出约束对齐
  draft_with_model: false  # 建库脚本默认用正文截断起草，避免为 55 个节点逐个调模型拖慢验证；按需经 /wiki/entry 调模型起草
  temperature: 0.1  # 起草摘要的低温度，减少节点外自由发挥
  max_tokens: 160  # 起草生成上限，防止思考型模型无限输出
  think: false  # 关闭思考链，确保摘要落到 message.content
# ===== 数据红线：只用合成资料作规则源 + 不替代行政审批 =====
redlines:  # 数据红线配置节
  max_input_chars: 600  # 输入长度上限，先挡超长文本
  personal_data_patterns:  # 疑似真实个人材料特征，命中即拦截且不落盘
    - '\d{17}[\dXx]'  # 18 位身份证号
    - '1[3-9]\d{9}'  # 11 位手机号
  forbidden_input_words:  # 要求系统代替行政审批的说法
    - "请批准"  # 直接索要批准结论
    - "准予"  # 直接索要准予结论
    - "直接审批"  # 要求系统审批
    - "作出行政决定"  # 要求系统作行政决定
    - "是否具有法律效力"  # 要求解释法律效力
  forbidden_output_words:  # 模型输出命中即脱敏并强制转人工
    - "批准通过"  # 越权批准结论
    - "准予受理"  # 越权受理结论
    - "审批通过"  # 越权审批结论
    - "具有法律效力"  # 越权效力判断
    - "可以正式受理"  # 越权受理承诺
# ===== 人工确认：AI 结论不得直接生效 =====
confirmation:  # 人工确认配置节
  store_path: "data/confirmations.json"  # 本地待确认单，标准库读写
  ttl_seconds: 3600  # 超时未确认即作废
  forbid_self_confirm: true  # 发起人与确认人不得为同一人（f23/f44）
# ===== 审计：能重建一次处理链 =====
audit:  # 审计流水配置节
  path: "data/audit.jsonl"  # 本地 JSONL 流水，标准库追加写
# ===== 知识图谱：知识与知识之间的显式关联，本地文件 + 标准库存取 =====
graph:  # 知识图谱配置节
  path: "kb/graph.json"  # 图谱快照路径，由 scripts/build_graph.py 生成，人工登记的新关联也落这里
  evidence_depth: 2  # 预检时从检索命中的事实向外扩展的关联跳数
  max_depth: 4  # 子图与证据链允许的最大跳数，防止一次拉全图
  max_nodes: 60  # 单次查询最多返回的节点数
  max_hops: 24  # 单次证据链最多返回的逐跳关联数，避免把全图当证据
  max_edges: 120  # 单次子图最多返回的内部关联数
  related_threshold: 0.08  # 正文中文二字词 Jaccard 阈值，达到才建「内容相关」关联
  related_top_k: 3  # 每条事实最多保留的「内容相关」关联数，避免全连接图
  writable_relations:  # 人工确认后允许补登记的关联语义白名单
    - "依赖"  # 一条知识的成立依赖另一条
    - "冲突于"  # 两条知识口径冲突，须人工裁定
    - "替代"  # 新版本替代旧知识
    - "需补正"  # 触发补正的知识关联
    - "需人工核对"  # 依据不足，必须转人工
    - "内容相关"  # 人工核对后认定的内容关联
