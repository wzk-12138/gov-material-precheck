# ===== 服务：只监听本机回环，数据与推理不离开本地 =====
service:  # 服务监听配置节
  host: "127.0.0.1"  # 仅本机可访问，禁止绑定 0.0.0.0 对外暴露
  port: 8000  # 手动启动端口；验证脚本自动改用 9000 以免端口冲突
# ===== 认证：角色与令牌绑定，禁止只凭明文角色头调用 =====
auth:  # 对外接口认证配置节
  required: true  # 强制校验；置 false 即退回明文角色模式，仅允许本地调试
  header_name: "X-Agent-Token"  # 凭据请求头名称，/health 免凭据
  token_env: "AGENT_ROLE_TOKENS"  # 凭据表所在环境变量名，值为 {"window":"令牌",...} 的 JSON，不落盘
# ===== agent-harness：智能体运行壳的业务配置 =====
agent:  # 智能体运行壳配置节
  name: "办事材料预检智能体"  # 系统名（本轮已确认）
  system_prompt: "你只做办事材料清单预检与补正解释提示；必须引用给定证据编号；不得输出批准结论、不得解释法律效力、不得承诺办理结果；结论只作为待人工确认的建议；回答控制在 120 字内。"  # 系统提示集中配置，代码不写死；末句限制长度以压住 CPU 推理耗时
  no_evidence_hint: "未检索到可核对的规则依据，请转人工核对，本系统不给出结论。"  # 无命中规则时的兜底提示
# ===== 本机 Ollama：模型地址与名称集中配置，代码内禁止写死 =====
ollama:  # 本机模型配置节
  base_url: "http://127.0.0.1:11434"  # 本机 Ollama 服务地址，可改
  model: "qwen3.5:0.8b"  # 本机已拉取的模型名（原 qwen2.5:7b 未下载），换模型时须同步改文档
  timeout_seconds: 30  # 单次生成超时，给 CPU 冷启动与生成留余量
  probe_timeout_seconds: 5  # 模型列表探测超时，服务离线时快速返回不拖慢验证
  max_tokens: 160  # 生成上限，防止思考型模型无休止输出导致超时
  think: false  # 关闭思考链，确保结果落到 message.content 而不是 message.thinking
  required: false  # 未启动 Ollama 时降级为「仅检索提示」，人工流程照常（对齐 f35）
  temperature: 0.1  # 低温度，减少自由发挥导致的越权结论
# ===== 知识库：合成训练资料为唯一规则源，本地文件 + 标准库检索 =====
knowledge:  # 本地知识库配置节
  sources:  # 规则源清单，路径相对项目根目录
    - "../discovery-report.json"  # 合成访谈事实，禁止替换为真实业务数据
  kb_path: "kb/rules.json"  # 由 scripts/build_kb.py 生成的本地规则库
  top_k: 3  # 每次检索返回的最多证据条数
  min_score: 0.02  # 低于该相关度视为无依据，必须转人工
# ===== 角色与权限：按六角色访谈事实配置 =====
roles:  # 角色与权限矩阵配置节
  window:  # 窗口工作人员 林亦舟
    label: "窗口工作人员"  # 显示名
    allow_precheck: true  # 可发起清单预检
    can_view_material: true  # 可查看授权范围内材料与证据原文
    allow_confirm: false  # 不能确认自己发起的建议
  reviewer:  # 业务审核员 唐映秋
    label: "业务审核员"  # 显示名
    allow_precheck: true  # 可发起清单预检
    can_view_material: true  # 可查看材料原文
    allow_confirm: true  # 可接手确认与核对
  supervisor:  # 数据与流程监督员 傅景
    label: "数据与流程监督员"  # 显示名
    allow_precheck: true  # 可发起清单预检
    can_view_material: true  # 按授权范围可查看材料
    allow_confirm: true  # 专业签核与风险否决
  hotline:  # 热线服务负责人 叶书
    label: "热线服务负责人"  # 显示名
    allow_precheck: true  # 可发起咨询类预检
    can_view_material: false  # 只看答复，不接触材料原文（f41）
    allow_confirm: false  # 不参与签核
  platform:  # 政务平台工程师 秦芮
    label: "政务平台工程师"  # 显示名
    allow_precheck: false  # 负责系统数据，不发起业务预检
    can_view_material: false  # 不查看业务材料
    allow_confirm: false  # 不参与签核
  director:  # 服务中心主任 顾明岚
    label: "服务中心主任"  # 显示名
    allow_precheck: false  # 负责目标与复盘，不发起日常预检
    can_view_material: false  # 不查看个体材料原文
    allow_confirm: false  # 不替代专业签核
# ===== 数据红线：只用合成资料作规则源 + 不替代行政审批 =====
redlines:  # 数据红线配置节
  max_input_chars: 600  # 输入长度上限，先挡超长文本
  personal_data_patterns:  # 疑似真实个人材料特征，命中即拦截且不落盘
    - '\d{17}[\dXx]'  # 18 位身份证号
    - '1[3-9]\d{9}'  # 11 位手机号
  forbidden_input_words:  # 要求系统代替行政审批的说法
    - "请批准"  # 直接索要批准结论
    - "准予"  # 直接索要准予结论
    - "直接审批"  # 要求系统审批
    - "作出行政决定"  # 要求系统作行政决定
    - "是否具有法律效力"  # 要求解释法律效力
  forbidden_output_words:  # 模型输出命中即脱敏并强制转人工
    - "批准通过"  # 越权批准结论
    - "准予受理"  # 越权受理结论
    - "审批通过"  # 越权审批结论
    - "具有法律效力"  # 越权效力判断
    - "可以正式受理"  # 越权受理承诺
# ===== 人工确认：AI 结论不得直接生效 =====
confirmation:  # 人工确认配置节
  store_path: "data/confirmations.json"  # 本地待确认单，标准库读写
  ttl_seconds: 3600  # 超时未确认即作废
  forbid_self_confirm: true  # 发起人与确认人不得为同一人（f23/f44）
# ===== 审计：能重建一次处理链 =====
audit:  # 审计流水配置节
  path: "data/audit.jsonl"  # 本地 JSONL 流水，标准库追加写
# ===== 知识图谱：知识与知识之间的显式关联，本地文件 + 标准库存取 =====
graph:  # 知识图谱配置节
  path: "kb/graph.json"  # 图谱快照路径，由 scripts/build_graph.py 生成，人工登记的新关联也落这里
  evidence_depth: 2  # 预检时从检索命中的事实向外扩展的关联跳数
  max_depth: 4  # 子图与证据链允许的最大跳数，防止一次拉全图
  max_nodes: 60  # 单次查询最多返回的节点数
  max_hops: 24  # 单次证据链最多返回的逐跳关联数，避免把全图当证据
  max_edges: 120  # 单次子图最多返回的内部关联数
  related_threshold: 0.08  # 正文中文二字词 Jaccard 阈值，达到才建「内容相关」关联
  related_top_k: 3  # 每条事实最多保留的「内容相关」关联数，避免全连接图
  writable_relations:  # 人工确认后允许补登记的关联语义白名单
    - "依赖"  # 一条知识的成立依赖另一条
    - "冲突于"  # 两条知识口径冲突，须人工裁定
    - "替代"  # 新版本替代旧知识
    - "需补正"  # 触发补正的知识关联
    - "需人工核对"  # 依据不足，必须转人工
    - "内容相关"  # 人工核对后认定的内容关联
